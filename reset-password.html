<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Reset Password — Urdu Writer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/home.css?v=design-20261105-2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="assets/js/feedback-config.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/reset-password.js" defer></script>
</head>
<body class="home-page reset-page">
  <header class="home-header" dir="ltr">
    <a class="home-brand" href="index.html">Urdu Writer</a>
  </header>
  <main class="reset-main">
    <section class="reset-card" aria-labelledby="reset-title">
      <p class="section-kicker">Account security</p>
      <h1 id="reset-title">Choose a new password</h1>
      <p>Enter and confirm your new password to finish resetting your account.</p>
      <form id="reset-password-form" class="auth-form" hidden>
        <label>New Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm New Password<input name="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label>
        <button id="reset-password-submit" class="auth-submit" type="submit">Update Password</button>
      </form>
      <p id="auth-notice" class="auth-notice" role="status" aria-live="polite">Checking your password reset link…</p>
      <a class="reset-back" href="index.html">Return to login</a>
    </section>
  </main>
</body>
</html>
